ublox_gps_node_rover_1:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyUSB0
    frame_id: gps_moving_base
    hpg_type: 0
    uart1:
      baudrate: 115200
    nav_rate: 1
    rate: 1.0

    tmode3: 0 #0 for disabled, 1 for survey-in, 2 for fixed (used for base station i think)

    #1 for rtk float, 2 for rtk fixed
    #dgnss_mode: 2
    rtcm:
      set: true
      moving_base: true
      type_4072_0: true
      type_1074: true
      type_1084: true
      type_1094: true
      type_1124: true
      type_1230: true

    gnss:
      gps: true
      glonass: true
      galileo: true
      beidou: true
      qzss: true

    # publish:
    #   rxm:
    #     rtcm: True