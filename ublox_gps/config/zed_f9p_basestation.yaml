ublox_gps_node:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: gps
    uart1:
      baudrate: 115200
    tmode3: 1
    sv_in:
      reset: True               # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 60              # Survey-In Minimum Duration [s]
      acc_lim: 5.0              # Survey-In Accuracy Limit [m]

    publish:
      rtcm: true
      nmea: false

    rtcm:
      set: true
      type_1005: true
      type_1074: true
      type_1084: true
      type_1124: true
      type_1230: true
    
    nmea:
      set: false