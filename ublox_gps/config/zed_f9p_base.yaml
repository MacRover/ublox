ublox_gps_node_basestation:
  ros__parameters:
    debug: 1                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM1
    frame_id: gps_base
    hpg_type: 1
    uart1:
      baudrate: 115200
    nav_rate: 1
    rate: 1.0
    tmode3: 1
    sv_in:
      reset: True               # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]

    publish:
      rtcm: true
      nmea: false
      nav:
        svin: true

    rtcm:
      set: true
      moving_base: false
      type_1005: true
      type_1074: true
      type_1084: true
      type_1094: true
      type_1124: true
      type_1230: true
    
    gnss:
      gps: true
      glonass: true
      galileo: true
      beidou: true
      qzss: true
    
    nmea:
      set: false